name: Daily capture refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # Install current CLIs on the bare runner and avoid the container refresh when
  # every recorded version is already current.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      changed_tools: ${{ steps.check.outputs.changed_tools }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test review validation
        run: node .github/scripts/test-validate-review.cjs

      - name: Install CLIs
        # Codex is source-extracted, so its upstream revision is checked without
        # installing its CLI in this job.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Check versions
        id: check
        run: bash .github/scripts/check-versions.sh

  auth-preflight:
    needs: check
    if: needs.check.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runnable_tools: ${{ steps.select.outputs.runnable_tools }}
      has_runnable_tools: ${{ steps.select.outputs.has_runnable_tools }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build refresh image
        run: docker build -t agent-autopsy-refresh .

      - name: Refresh capture credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_CHATGPT_AUTH_JSON: ${{ secrets.CODEX_CHATGPT_AUTH_JSON }}
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
          ANTIGRAVITY_GEMINI_CREDS: ${{ secrets.ANTIGRAVITY_GEMINI_CREDS }}
          REPO_SECRETS_PAT: ${{ secrets.REPO_SECRETS_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .capture-scratch
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e CODEX_CHATGPT_AUTH_JSON \
            -e GROK_AUTH_JSON \
            -e ANTIGRAVITY_GEMINI_CREDS \
            -e REPO_SECRETS_PAT \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY \
            agent-autopsy-refresh \
            bash -euo pipefail -c '
              bash .github/scripts/seed-credentials.sh
              if grok -p "Reply exactly: GROK_AUTH_OK" --output-format json >/dev/null; then
                printf true > /workspace/.capture-scratch/grok-auth-ready
              else
                printf false > /workspace/.capture-scratch/grok-auth-ready
                echo "::warning::Grok authentication refresh failed; Grok will be excluded from this run."
              fi
              bash .github/scripts/rotate-secrets.sh
            '

      - name: Select authenticated tools
        id: select
        env:
          CHANGED_TOOLS_JSON: ${{ needs.check.outputs.changed_tools }}
        run: |
          grok_auth_ready="$(cat .capture-scratch/grok-auth-ready 2>/dev/null || printf false)"
          runnable_tools="$(jq -ce --argjson grok_auth_ready "$grok_auth_ready" \
            '[.[] | select(.tool != "grok" or $grok_auth_ready)]' <<< "$CHANGED_TOOLS_JSON")"
          printf 'runnable_tools=%s\n' "$runnable_tools" >> "$GITHUB_OUTPUT"
          if jq -e 'length > 0' <<< "$runnable_tools" >/dev/null; then
            echo 'has_runnable_tools=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_runnable_tools=false' >> "$GITHUB_OUTPUT"
          fi

  refresh-tool:
    needs: [check, auth-preflight]
    if: needs.auth-preflight.outputs.has_runnable_tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.auth-preflight.outputs.runnable_tools) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build refresh image
        run: docker build -t agent-autopsy-refresh .

      - name: Refresh ${{ matrix.tool }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_CHATGPT_AUTH_JSON: ${{ secrets.CODEX_CHATGPT_AUTH_JSON }}
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
          ANTIGRAVITY_GEMINI_CREDS: ${{ secrets.ANTIGRAVITY_GEMINI_CREDS }}
          CODEX_REFRESH_MODEL: gpt-5.6-luna
          CODEX_REFRESH_REASONING_EFFORT: medium
          CODEX_REVIEW_MODEL: gpt-5.6-luna
          CODEX_REVIEW_REASONING_EFFORT: medium
          CODEX_AUTHOR_TIMEOUT: 30m
          CODEX_REVIEW_TIMEOUT: 10m
          TOOL_JSON: ${{ toJSON(matrix) }}
        run: |
          mkdir -p .capture-scratch/${{ matrix.tool }}
          printf '%s\n' "$TOOL_JSON" | jq -c '[.]' > .capture-scratch/changed-tools.json
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e CODEX_CHATGPT_AUTH_JSON \
            -e GROK_AUTH_JSON \
            -e ANTIGRAVITY_GEMINI_CREDS \
            -e CODEX_REFRESH_MODEL \
            -e CODEX_REFRESH_REASONING_EFFORT \
            -e CODEX_REVIEW_MODEL \
            -e CODEX_REVIEW_REASONING_EFFORT \
            -e CODEX_AUTHOR_TIMEOUT \
            -e CODEX_REVIEW_TIMEOUT \
            -e CODEX_SUMMARY_FILE="/workspace/.capture-scratch/${{ matrix.tool }}/summary.md" \
            -e CODEX_VALIDATION_FILE="/workspace/.capture-scratch/${{ matrix.tool }}/validation.txt" \
            -e CODEX_REVIEW_FILE="/workspace/.capture-scratch/${{ matrix.tool }}/review.json" \
            agent-autopsy-refresh \
            bash -euo pipefail -c '
              git config --global --add safe.directory /workspace
              bash .github/scripts/seed-credentials.sh
              bash .github/scripts/sync-codex-reference.sh
              if [ -f .capture-scratch/changed-tools.json ] && jq -e "any(.[]; .tool == \"grok\")" .capture-scratch/changed-tools.json >/dev/null; then
                rm -rf references/grok-build
                git clone --quiet --depth 1 https://github.com/xai-org/grok-build.git references/grok-build
              fi
              bash .github/scripts/run-codex-refresh.sh
            '
          sudo chown -R "$(id -u):$(id -g)" "${{ matrix.dir }}" ".capture-scratch/${{ matrix.tool }}"

      - name: Upload run scratch state
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: refresh-${{ matrix.tool }}
          path: |
            ${{ matrix.dir }}/
            .capture-scratch/${{ matrix.tool }}/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [check, auth-preflight, refresh-tool]
    if: always() && needs.auth-preflight.outputs.has_runnable_tools == 'true' && needs.refresh-tool.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download approved refreshes
        uses: actions/download-artifact@v5
        with:
          pattern: refresh-*
          merge-multiple: true

      - name: Publish approved refreshes
        env:
          CHANGED_TOOLS_JSON: ${{ needs.auth-preflight.outputs.runnable_tools }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .capture-scratch
          printf '%s\n' "$CHANGED_TOOLS_JSON" | jq -e -c 'if type == "array" then . else error("changed-tools output is not an array") end' > .capture-scratch/changed-tools.json
          : > .capture-scratch/codex-summary.md
          while IFS= read -r tool; do
            cat ".capture-scratch/$tool/summary.md" >> .capture-scratch/codex-summary.md
            printf '\n\n' >> .capture-scratch/codex-summary.md
          done < <(jq -r '.[].tool' .capture-scratch/changed-tools.json)
          jq -s '{decision: "approve", publish_safe: true, summary: "Independent per-tool reviews approved publication.", issues: ([.[].issues[]] | unique), tool_results: [.[].tool_results[]]}' .capture-scratch/*/review.json > .capture-scratch/review-result.json
          gh auth setup-git
          bash .github/scripts/commit-and-release.sh
